<!DOCTYPE html>
<html lang="ru" data-page="maps">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карты выживания — SURVIVE.CIV</title>
    <meta name="description" content="Интерактивные карты выживания: спутник, топография, датасеты опасностей, навигация, маршруты, компас, прогноз погоды.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://survive-civ.github.io/maps.html">
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dossier.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; background: var(--bg-primary, #0a0a0f); }

        #map-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color, #333);
            font-family: 'Special Elite', 'Courier Prime', monospace;
        }
        #map-nav .nav-logo {
            display: flex;
            align-items: center;
            gap: 2px;
            text-decoration: none;
        }
        #map-nav .logo-bracket { color: var(--accent, #c8b888); font-size: 18px; }
        #map-nav .logo-text { color: var(--text-ink, #d4c5a9); font-size: 18px; font-weight: 700; }
        #map-nav .logo-dot { color: var(--accent, #c8b888); font-size: 18px; }
        #map-nav .logo-civ { color: var(--accent, #c8b888); font-size: 18px; }
        #map-nav .nav-links {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        #map-nav .nav-link {
            color: var(--text-ink-dim, #8a7e6b);
            text-decoration: none;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 4px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        #map-nav .nav-link:hover,
        #map-nav .nav-link.active {
            color: var(--text-ink, #d4c5a9);
            background: rgba(200, 184, 136, 0.1);
        }
        #map-nav .nav-link.active {
            border: 1px solid var(--accent, #c8b888);
        }
        #map-nav .nav-burger {
            display: none;
            background: none;
            border: 1px solid var(--border-color, #333);
            color: var(--text-ink, #d4c5a9);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 4px;
        }

        #map-frame {
            position: fixed;
            top: 52px;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: calc(100vh - 52px);
            border: none;
        }

        @media (max-width: 768px) {
            #map-nav .nav-links { display: none; }
            #map-nav .nav-links.open {
                display: flex;
                flex-direction: column;
                position: absolute;
                top: 52px;
                left: 0;
                right: 0;
                background: rgba(10, 10, 15, 0.97);
                border-bottom: 1px solid var(--border-color, #333);
                padding: 10px;
                gap: 4px;
            }
            #map-nav .nav-burger { display: block; }
        }
    </style>
</head>
<body>
    <nav id="map-nav">
        <a href="index.html" class="nav-logo">
            <span class="logo-bracket">[</span><span class="logo-text">SURVIVE</span><span class="logo-dot">.</span><span class="logo-civ">CIV</span><span class="logo-bracket">]</span>
        </a>
        <div class="nav-links" id="nav-links">
            <a href="index.html" class="nav-link">Главная</a>
            <a href="scenarios.html" class="nav-link">Сценарии</a>
            <a href="articles.html" class="nav-link">Статьи</a>
            <a href="maps.html" class="nav-link active">Карты</a>
            <a href="shop.html" class="nav-link">Магазин</a>
        </div>
        <button class="nav-burger" id="nav-burger" aria-label="Меню">&#9776;</button>
    </nav>

    <iframe id="map-frame" src="map/index.html" allow="geolocation" loading="lazy"></iframe>

    <script>
        document.getElementById('nav-burger').addEventListener('click', function () {
            document.getElementById('nav-links').classList.toggle('open');
        });
    </script>
</body>
</html>
